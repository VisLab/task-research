[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-research"
version = "0.1.0"
description = "Research scripts for categorizing cognitive tasks and processes using OpenAlex, Cognitive Atlas, and HED annotation."
readme = "README.md"
authors = [
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" },
]
maintainers = [
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" },
]
license = {text = "MIT"}
keywords = ["cognitive tasks", "cognitive processes", "HED", "OpenAlex", "Cognitive Atlas", "neuroscience", "annotation", "taxonomy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
]

requires-python = ">=3.10"

dependencies = [
    # hed-metadata-toolkit (shared API clients, cache, citation identity) is
    # also required but is installed separately as an editable install from
    # its own checkout: pip install -e <path-to-hed-metadata-toolkit>
    # A committed path dependency is not portable; switch to a pinned Git URL
    # or PyPI release once the toolkit is published.
    "requests>=2.28.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "typos>=1.29.0",
    "mdformat>=0.7.0",
]
test = [
    "coverage>=7.0.0",
    "pytest>=8.0.0",
]
# PDF -> Markdown conversion (used by literature_search/convert.py).
# marker-pdf is a layout-aware ML-based converter — much better than
# markitdown for academic papers (preserves equations, tables, multi-
# column layout), but heavier (first run downloads ~5 GB of model
# weights to ~/.cache/marker).  GPU acceleration auto-detected.
pdf = [
    "marker-pdf>=1.0.0",
]
# Browser-based fetcher for WAF-protected OA repositories (Columbia
# Academic Commons and similar; see acquire/fetch_browser.py).
# Playwright drives a headless Chromium so the WAF challenges
# resolve and the meta-tag PDF URL becomes reachable.  After
# `pip install -e ".[browser]"` run `playwright install chromium`
# to fetch the browser binary (~150 MiB).
browser = [
    "playwright>=1.40.0",
]


[tool.pytest.ini_options]
# Register custom markers so unrecognised-marker warnings stay quiet.
markers = [
    "network: tests that hit a live network API; skip with -m 'not network'",
    "slow: tests that import heavy dependencies or take noticeable wall time",
    "browser: tests that launch a real Chromium via Playwright; skip with -m 'not browser'",
]


[tool.typos.files]
extend-exclude = [
    "*.pdf",
    "*.svg",
    "venv*/",
    ".venv*/",
    "*.yaml",
    "*.yml",
    "*.json",
    "*.toml",
    "OpenAlex/raw/",
    "OpenAlex/normalized/",
]

[tool.typos.default.extend-words]
# Domain-specific terms and abbreviations that are not typos
te = "te"
hed = "hed"

[tool.ruff]
# Target Python 3.10+
target-version = "py310"
line-length = 120

# Exclude common directories
exclude = [
    '.git',
    '.venv',
    'venv',
    '__pycache__',
    'build',
    'dist',
    '*.egg-info',
    'OpenAlex/raw',
    'OpenAlex/normalized',
    '.status',
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# __init__.py files: unused imports are re-exports, and their import order is
# curated by hand to avoid circular imports - isort must not reorder them.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["OpenAlex"]

[tool.ruff.format]
# Ruff format settings
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
